name: Publish Quarto Website

on:
  push:
    branches: 
      - main
      - master
  pull_request:
    branches: 
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Inject Password Hash
        env:
          GALLERY_PASSWORD: ${{ secrets.GALLERY_PASSWORD }}
        run: |
          # Generate SHA-256 hash of the password secret
          if [ -z "$GALLERY_PASSWORD" ]; then
            echo "Error: GALLERY_PASSWORD secret is required but not set."
            echo "Please configure the GALLERY_PASSWORD secret in repository settings."
            exit 1
          fi
          
          PASSWORD_HASH=$(echo -n "$GALLERY_PASSWORD" | sha256sum | awk '{print $1}')
          echo "Injecting password hash into gallery password protection script..."
          # Using pipe delimiter is safe for SHA-256 hex strings (only contains 0-9, a-f)
          sed -i "s|%%GALLERY_PASSWORD_HASH%%|$PASSWORD_HASH|" docs/gallery/password-protect.js
          
          # Verify the injection succeeded
          if grep -q "const PASSWORD_HASH = '$PASSWORD_HASH';" docs/gallery/password-protect.js; then
            echo "Password hash injection successful."
          else
            echo "Error: Failed to inject password hash."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4